name: Official Shopping Sessions 1M dev check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build organizer's generator
        run: cargo build --manifest-path tools/official-generator/Cargo.toml --release --locked
      - name: Export compiled official generator for benchmarking
        uses: actions/upload-artifact@v4
        with:
          name: official-generator-amd64
          path: tools/official-generator/target/release/generate
          retention-days: 1
      - name: Generate deterministic official dev inputs
        run: |
          mkdir -p /tmp/shop-dev /tmp/shop-scratch /tmp/shop-out
          tools/official-generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output /tmp/shop-dev
      - name: Compile engine and install DuckDB
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -march=x86-64 -flto -fopenmp -o shopping-core main.cpp
          python3 -m pip install --only-binary=:all: duckdb==1.4.1
      - name: Run complete CSV-to-Parquet pipeline
        env:
          DATA_DIR: /tmp/shop-dev
          OUTPUT_DIR: /tmp/shop-out
          SCRATCH_DIR: /tmp/shop-scratch
          NCPU: "8"
        run: |
          /usr/bin/time -v ./shopping-core
          /usr/bin/time -v python3 write_parquet.py
          python3 scripts/check_official_dev.py

      - name: Compare actual rows with public reference on failure
        if: failure()
        run: |
          curl -fsSL --retry 2 --max-time 60 https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/dev-answer.zip -o /tmp/shop-dev-answer.zip
          mkdir -p /tmp/shop-answer
          unzip -oq /tmp/shop-dev-answer.zip -d /tmp/shop-answer
          python3 scripts/diff_official_dev.py /tmp/shop-scratch /tmp/shop-answer
      - name: Save 1M dev output for diagnostic comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-dev-generated-rows
          path: |
            /tmp/shop-scratch/user_rows.csv
            /tmp/shop-scratch/campaign_rows.csv
          retention-days: 1
